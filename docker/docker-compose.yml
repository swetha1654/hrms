version: "3.8" # Updated version
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    ports:
      - 8010:8000
      - 9000:9000

volumes:
  postgres-data:
